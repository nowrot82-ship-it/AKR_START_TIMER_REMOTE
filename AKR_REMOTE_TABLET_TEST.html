
<style>
/* AKR v4.5 PRO DISPLAY */

#clockFace{
 width:100%;
 height:100%;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:flex-start;
 gap:0;
 padding:0 12px;
}

#brandLogo{
 width:65%;
 height:23%;
 min-height:0;
 flex-shrink:0;
 object-fit:contain;
 object-position:center top;
 margin:0;
 padding:0;
}

#brandFallback{
 flex-shrink:0;
 margin:0;
 padding:0;
}

#clockDigits{
 flex:1;
 width:100%;
 height:auto;
 min-height:0;
 margin:0;
 padding:0;
 display:flex;
 align-items:center;
 justify-content:center;
}

#clockDigits svg{
 width:100%;
 height:100%;
 display:block;
 overflow:visible;
}

#clockValue{
 transform-box:fill-box;
 transform-origin:center;
 transform:scaleY(1.95);
}

#status{
 font-size:clamp(20px,5.5vw,76px);
 font-weight:900;
 line-height:1;
 padding:8px 10px 12px;
 margin:0;
}

#clock{
 overflow:hidden;
}

#top{
 padding:3px 12px;
}

#detail{
 padding:2px 8px 4px;
}

</style>

<script>
document.addEventListener('DOMContentLoaded',function(){

 document.title='AKR START TIMER v4.5 PRO DISPLAY';

 const version=document.querySelector('#top > span');

 if(version){
  version.textContent='START TIMER PRO v4.5 TEST';
 }

 const svg=document.querySelector('#clockDigits svg');

 if(svg){
  svg.setAttribute('viewBox','0 0 640 230');
  svg.setAttribute('preserveAspectRatio','none');
 }

 const clock=document.getElementById('clockValue');

 if(clock){
  clock.setAttribute('y','115');
 }

});
</script>
