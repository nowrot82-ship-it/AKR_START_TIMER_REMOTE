
<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AKR REMOTE PILOT · TEST</title>
<style>
:root{font-family:Arial,sans-serif;background:#101010;color:white}
*{box-sizing:border-box}
body{margin:0;padding:20px}
.wrap{max-width:560px;margin:auto}
h1{font-size:27px}
.muted{color:#bbb}
label{display:block;margin:16px 0 6px;font-weight:bold}
input,select,button{width:100%;padding:16px;border-radius:12px;font-size:20px}
input,select{background:#262626;color:white;border:1px solid #777}
button{margin-top:16px;border:0;font-weight:900;background:#ed2431;color:white}
button:disabled{opacity:.5}
.status{padding:14px;background:#242424;border-radius:12px;margin-top:18px;line-height:1.5}
#panel{display:none}
.warn{color:#ffd875}
</style>
</head>
<body>
<div class="wrap">
<h1>AKR <span style="color:#ff4141">REMOTE PILOT</span> 📱</h1>
<p class="muted">TEST komunikacji · bez zapisu czasów</p>

<div id="authBox">
<label>Email PILOTA</label>
<input id="email" type="email" autocomplete="username" placeholder="pilot@akr-test.example.com">
<label>Hasło</label>
<input id="password" type="password" autocomplete="current-password">
<button id="login" style="background:#444">ZALOGUJ</button>
</div>

<div id="panel">
<p class="muted">Zalogowano jako PILOT</p>
<label>Odcinek</label>
<select id="os">
<option>OS1</option><option>OS2</option><option>OS3</option>
<option>OS4</option><option>OS5</option><option>OS6</option>
</select>
<label>Numer załogi</label>
<input id="crew" inputmode="numeric" maxlength="4" placeholder="np. 12">
<button id="start">START · WYŚLIJ DO TABLETU</button>
<p class="warn">Tylko test odliczania. Bez zapisu pomiaru.</p>
<button id="logout" style="background:#444">WYLOGUJ</button>
</div>

<div class="status" id="status">Zaloguj się kontem PILOTA.</div>
</div>

<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {getDatabase,ref,set,serverTimestamp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js';

const config={
 apiKey:'AIzaSyCU1FXL73n3NXloigcNEBREIYfClktYLbQ',
 authDomain:'akr-start-timer-remote.firebaseapp.com',
 databaseURL:'https://akr-start-timer-remote-default-rtdb.europe-west1.firebasedatabase.app',
 projectId:'akr-start-timer-remote',
 appId:'1:463101905862:web:64c889a447de22ece380c7'
};

const PILOT='EPNp40d7FVMEMaKJw5nzIPv0h7G3';
const app=initializeApp(config);
const auth=getAuth(app);
const db=getDatabase(app);
const $=id=>document.getElementById(id);
const msg=s=>$('status').textContent=s;

onAuthStateChanged(auth,u=>{
 const ok=u?.uid===PILOT;
 $('authBox').style.display=ok?'none':'block';
 $('panel').style.display=ok?'block':'none';
 msg(ok?'Pilot gotowy. Sprawdź, czy tablet jest online.':
 u?'To nie jest konto PILOTA. Wyloguj się i użyj konta PILOT.':
 'Zaloguj się kontem PILOTA.');
});

$('login').onclick=async()=>{
 try{
  await signInWithEmailAndPassword(
   auth,$('email').value.trim(),$('password').value
  );
  $('password').value='';
 }catch(e){msg('Błąd logowania: '+e.code)}
};

$('logout').onclick=()=>signOut(auth);

$('start').onclick=async()=>{
 if(auth.currentUser?.uid!==PILOT){
  msg('Brak uprawnień PILOTA');return;
 }
 const crew=$('crew').value.trim();
 if(!/^\d{1,4}$/.test(crew)){
  msg('Wpisz numer załogi: 1–4 cyfry.');return;
 }
 const b=$('start');
 b.disabled=true;
 try{
  const cmd={
   id:crypto.randomUUID(),
   crew,
   os:$('os').value,
   issuedAt:serverTimestamp()
  };
  await set(ref(db,'remote/command'),cmd);
  msg('Polecenie wysłane do Firebase. To nie potwierdza jeszcze odbioru przez tablet.');
 }catch(e){
  msg('Błąd wysyłki: '+e.message);
 }finally{
  b.disabled=false;
 }
};
</script>
</body>
</html>
