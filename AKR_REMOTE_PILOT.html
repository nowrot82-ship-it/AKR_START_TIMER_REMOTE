
<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AKR REMOTE PILOT v2</title>
<style>
*{box-sizing:border-box}
html,body{
 margin:0;
 min-height:100%;
 background:#101010;
 color:white;
 font-family:Arial,Helvetica,sans-serif;
}
body{padding:18px}
.wrap{max-width:560px;margin:auto}
h1{font-size:28px;margin-bottom:6px}
.muted{color:#bbb}
label{
 display:block;
 margin:18px 0 7px;
 font-weight:bold;
}
input,select,button{
 display:block;
 width:100%;
 padding:17px;
 border-radius:12px;
 font-size:20px;
}
input,select{
 background:#262626;
 color:white;
 border:1px solid #777;
}
button{
 margin-top:15px;
 border:0;
 color:white;
 font-weight:900;
 cursor:pointer;
}
button:disabled{opacity:.4;cursor:not-allowed}
#start{background:#15803d;font-size:25px}
#stop{background:#b91c1c;font-size:25px}
#unlock{background:#555}
#login,#logout{background:#444}
#panel{display:none}
.status{
 padding:15px;
 background:#242424;
 border-radius:12px;
 margin-top:18px;
 line-height:1.5;
}
.connection{
 margin-top:12px;
 padding:12px;
 border-radius:10px;
 background:#551818;
 font-weight:bold;
 text-align:center;
}
.connection.online{background:#14532d}
.warning{
 color:#ffd875;
 font-size:14px;
 line-height:1.5;
}
</style>
</head>
<body>
<div class="wrap">
<h1>AKR <span style="color:#ff4141">REMOTE PILOT</span> 📱</h1>
<p class="muted">v2 · START / STOP OS / ODBLOKUJ</p>

<div id="authBox">
 <label>E-mail PILOTA</label>
 <input id="email" type="email"
  placeholder="pilot@akr-test.example.com"
  autocomplete="username">

 <label>Hasło</label>
 <input id="password" type="password"
  autocomplete="current-password">

 <button id="login">ZALOGUJ</button>
</div>

<div id="panel">
 <div id="connection" class="connection">
  BRAK POŁĄCZENIA
 </div>

 <label>Odcinek specjalny</label>
 <select id="os">
  <option>OS1</option>
  <option>OS2</option>
  <option>OS3</option>
  <option>OS4</option>
  <option>OS5</option>
  <option>OS6</option>
 </select>

 <label>Numer załogi</label>
 <input id="crew"
  inputmode="numeric"
  maxlength="4"
  placeholder="np. 12">

 <button id="start">START</button>
 <button id="stop">🛑 STOP OS</button>
 <button id="unlock">🔓 ODBLOKUJ OS</button>

 <p class="warning">
  Wersja testowa. Polecenie wysłane do Firebase
  nie oznacza jeszcze potwierdzenia wykonania
  przez tablet.
 </p>

 <button id="logout">WYLOGUJ</button>
</div>

<div class="status" id="status">
 Zaloguj się kontem PILOTA.
</div>
</div>

<script type="module">
import {initializeApp}
 from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';

import {
 getAuth,
 signInWithEmailAndPassword,
 signOut,
 onAuthStateChanged
} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';

import {
 getDatabase,
 ref,
 set,
 onValue,
 serverTimestamp
} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js';

const firebaseConfig={
 apiKey:'AIzaSyCU1FXL73n3NXloigcNEBREIYfClktYLbQ',
 authDomain:'akr-start-timer-remote.firebaseapp.com',
 databaseURL:
 'https://akr-start-timer-remote-default-rtdb.europe-west1.firebasedatabase.app',
 projectId:'akr-start-timer-remote',
 appId:'1:463101905862:web:64c889a447de22ece380c7'
};

const PILOT_UID='EPNp40d7FVMEMaKJw5nzIPv0h7G3';

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getDatabase(app);
const $=id=>document.getElementById(id);

let connected=false;
let busy=false;

const msg=s=>$('status').textContent=s;

function updateControls(){
 const authorized=auth.currentUser?.uid===PILOT_UID;
 const active=authorized && connected && !busy;

 $('start').disabled=!active;
 $('stop').disabled=!active;
 $('unlock').disabled=!active;

 $('connection').textContent=connected
  ? '● FIREBASE ONLINE'
  : '● FIREBASE OFFLINE';

 $('connection').className=connected
  ? 'connection online'
  : 'connection';
}

onValue(ref(db,'.info/connected'),snap=>{
 connected=snap.val()===true;
 updateControls();

 if(!connected){
  msg('BRAK POŁĄCZENIA Z FIREBASE');
 }
});

onAuthStateChanged(auth,user=>{
 const ok=user?.uid===PILOT_UID;

 $('authBox').style.display=ok?'none':'block';
 $('panel').style.display=ok?'block':'none';

 updateControls();

 msg(ok
  ? 'PILOT GOTOWY. Wybierz OS i numer załogi.'
  : user
   ? 'To nie jest konto PILOTA.'
   : 'Zaloguj się kontem PILOTA.');
});

$('login').onclick=async()=>{
 try{
  await signInWithEmailAndPassword(
   auth,
   $('email').value.trim(),
   $('password').value
  );
  $('password').value='';
 }catch(e){
  msg('Błąd logowania: '+e.code);
 }
};

$('logout').onclick=()=>signOut(auth);

async function sendCommand(type){
 if(auth.currentUser?.uid!==PILOT_UID){
  msg('BRAK UPRAWNIEŃ PILOTA');
  return;
 }

 if(!connected || busy){
  msg('BRAK POŁĄCZENIA LUB TRWA WYSYŁANIE');
  return;
 }

 const crew=$('crew').value.trim();
 const os=$('os').value;

 if(type==='START' && !/^\d{1,4}$/.test(crew)){
  msg('Wpisz numer załogi: 1–4 cyfry.');
  return;
 }

 busy=true;
 updateControls();

 try{
  const command={
   id:crypto.randomUUID(),
   type,
   issuedAt:serverTimestamp()
  };

  if(type==='START'){
   command.crew=crew;
   command.os=os;
  }

  await set(ref(db,'remote/command'),command);

  if(type==='START'){
   msg('START wysłany · '+os+
    ' · ZAŁOGA '+crew);
  }else if(type==='STOP'){
   msg('STOP OS wysłany do Firebase.');
  }else{
   msg('ODBLOKUJ OS wysłany do Firebase.');
  }

 }catch(e){
  msg('Błąd wysyłki: '+e.message);
 }finally{
  busy=false;
  updateControls();
 }
}

$('start').onclick=()=>sendCommand('START');

$('stop').onclick=()=>{
 if(confirm(
  'Wysłać STOP OS? Tablet powinien przerwać odliczanie i zablokować START.'
 )){
  sendCommand('STOP');
 }
};

$('unlock').onclick=()=>{
 if(confirm(
  'Odblokować OS i pozwolić na kolejne START-y?'
 )){
  sendCommand('UNLOCK');
 }
};
</script>
</body>
</html>
