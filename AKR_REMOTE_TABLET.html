
<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AKR REMOTE TABLET v3</title>
<style>
*{box-sizing:border-box}
html,body{
 margin:0;
 width:100%;
 height:100%;
 background:#000;
 color:#fff;
 font-family:Arial,Helvetica,sans-serif;
 overflow:hidden;
}
body{
 display:flex;
 flex-direction:column;
}
#loginScreen{
 width:100%;
 max-width:500px;
 margin:auto;
 padding:24px;
}
h1{font-size:28px}
input,button{
 width:100%;
 padding:15px;
 margin:8px 0;
 border-radius:10px;
 font-size:19px;
}
input{
 background:#222;
 color:white;
 border:1px solid #777;
}
button{
 border:0;
 color:white;
 font-weight:900;
 cursor:pointer;
}
#loginBtn{background:#444}
#appScreen{
 display:none;
 width:100%;
 height:100%;
 flex-direction:column;
 background:#000;
}
#top{
 display:flex;
 justify-content:space-between;
 align-items:center;
 padding:10px 18px;
 gap:12px;
 font-size:15px;
 color:#aaa;
}
#status{
 text-align:center;
 font-size:16px;
 color:#ddd;
 padding:6px 12px;
}
#display{
 flex:1;
 display:flex;
 align-items:center;
 justify-content:center;
 overflow:hidden;
 min-height:0;
}
#clock{
 font-size:min(21vw,45dvh);
 font-weight:900;
 font-variant-numeric:tabular-nums;
 letter-spacing:-.09em;
 white-space:nowrap;
 line-height:1;
}
#countdown{
 display:none;
 font-size:min(65vw,82dvh);
 font-weight:900;
 color:#fff;
 font-variant-numeric:tabular-nums;
 line-height:1;
}
#go{
 display:none;
 font-size:min(44vw,70dvh);
 font-weight:900;
 color:#fff;
 line-height:1;
}
#lockedScreen{
 display:none;
 text-align:center;
 color:#fff;
 font-size:min(10vw,15dvh);
 font-weight:900;
 line-height:1.1;
}
#bottom{
 display:flex;
 gap:12px;
 padding:10px 18px 18px;
}
#bottom button{
 flex:1;
 margin:0;
 font-size:17px;
 padding:12px;
}
#stopBtn{background:#a90000}
#unlockBtn{background:#444}
#logoutBtn{background:#333}
#detail{
 font-size:13px;
 color:#ddd;
 text-align:center;
 padding:0 12px 6px;
}
#appScreen.counting{background:#d60000}
#appScreen.going{background:#00c83a}
#appScreen.stopped{background:#d60000}
#appScreen.counting #status,
#appScreen.going #status,
#appScreen.stopped #status{
 color:#fff;
}
</style>
</head>
<body>

<div id="loginScreen">
 <h1>AKR REMOTE TABLET 🏁</h1>
 <p>Logowanie stanowiska START</p>
 <input id="email" type="email"
  placeholder="tablet@akr-test.example.com">
 <input id="password" type="password"
  placeholder="Hasło">
 <button id="loginBtn">ZALOGUJ</button>
 <p id="loginStatus"></p>
</div>

<div id="appScreen">
 <div id="top">
  <span>AKR REMOTE TABLET v3</span>
  <span id="connection">ŁĄCZENIE...</span>
 </div>

 <div id="status">OCZEKIWANIE NA START</div>

 <div id="display">
  <div id="clock">00:00:00</div>
  <div id="countdown">30</div>
  <div id="go">GO</div>
  <div id="lockedScreen">STOP<br>OS</div>
 </div>

 <div id="detail"></div>

 <div id="bottom">
  <button id="stopBtn">🛑 STOP OS</button>
  <button id="unlockBtn">🔓 ODBLOKUJ</button>
  <button id="logoutBtn">WYLOGUJ</button>
 </div>
</div>

<script type="module">
import {initializeApp}
 from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';

import {
 getAuth,
 signInWithEmailAndPassword,
 signOut,
 onAuthStateChanged
} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';

import {
 getDatabase,
 ref,
 onValue
} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js';

const firebaseConfig={
 apiKey:'AIzaSyCU1FXL73n3NXloigcNEBREIYfClktYLbQ',
 authDomain:'akr-start-timer-remote.firebaseapp.com',
 databaseURL:
 'https://akr-start-timer-remote-default-rtdb.europe-west1.firebasedatabase.app',
 projectId:'akr-start-timer-remote',
 appId:'1:463101905862:web:64c889a447de22ece380c7'
};

const TABLET_UID='jUcle8wKtmOh4Sng3X363fvG4gt2';

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getDatabase(app);
const $=id=>document.getElementById(id);

let connected=false;
let locked=false;
let running=false;
let goVisible=false;
let lastCommandId=null;
let initialized=false;
let serverOffset=0;
let countdownDeadline=0;
let countdownFrame=null;
let goTimeout=null;
let unsubscribeCommands=null;

function status(s){
 $('status').textContent=s;
}

function show(name){
 for(const id of ['clock','countdown','go','lockedScreen']){
  $(id).style.display=id===name?'block':'none';
 }

 const screen=$('appScreen');

 screen.classList.remove(
  'counting','going','stopped'
 );

 if(name==='countdown'){
  screen.classList.add('counting');
 }else if(name==='go'){
  screen.classList.add('going');
 }else if(name==='lockedScreen'){
  screen.classList.add('stopped');
 }
}

function cancelTimers(){
 if(countdownFrame!==null){
  cancelAnimationFrame(countdownFrame);
  countdownFrame=null;
 }
 if(goTimeout!==null){
  clearTimeout(goTimeout);
  goTimeout=null;
 }
 running=false;
 goVisible=false;
}

function showIdle(){
 cancelTimers();

 if(locked){
  show('lockedScreen');
  status('OS ZABLOKOWANY');
 }else{
  show('clock');
  status(connected
   ? 'POŁĄCZONO · OCZEKIWANIE NA START'
   : 'BRAK POŁĄCZENIA · START NIEDOSTĘPNY');
 }
}

function stopOS(source){
 locked=true;
 showIdle();
 $('detail').textContent='STOP OS · '+source;
}

function unlockOS(source){
 locked=false;
 showIdle();
 $('detail').textContent='ODBLOKOWANO · '+source;
}

function finishCountdown(){
 if(!running)return;

 running=false;
 goVisible=true;
 show('go');
 status('GO!');
 $('detail').textContent='START!';

 goTimeout=setTimeout(()=>{
  goTimeout=null;
  goVisible=false;
  showIdle();
 },3000);
}

function tick(){
 if(!running)return;

 if(!connected || locked){
  stopOS('UTRATA POŁĄCZENIA');
  return;
 }

 const remaining=countdownDeadline-performance.now();

 if(remaining<=0){
  finishCountdown();
  return;
 }

 $('countdown').textContent=
  String(Math.ceil(remaining/1000));

 countdownFrame=requestAnimationFrame(tick);
}

function startOS(command){
 if(locked || running || goVisible || !connected)return;

 cancelTimers();
 running=true;
 countdownDeadline=performance.now()+30000;

 $('detail').textContent=
  command.os+' · ZAŁOGA '+command.crew;

 status('ODLICZANIE DO STARTU');
 show('countdown');
 tick();
}

function handleCommand(command){
 if(!command || !command.id || !command.type)return;

 if(command.id===lastCommandId)return;
 lastCommandId=command.id;

 if(typeof command.issuedAt!=='number')return;

 const age=Date.now()+serverOffset-command.issuedAt;

 if(age>5000 || age< -2000)return;

 if(command.type==='STOP'){
  stopOS('PILOT');
  return;
 }

 if(command.type==='UNLOCK'){
  unlockOS('PILOT');
  return;
 }

 if(command.type==='START'){
  if(!/^\d{1,4}$/.test(String(command.crew)))return;
  if(!/^OS[1-6]$/.test(String(command.os)))return;
  startOS(command);
 }
}

function subscribeCommands(){
 if(unsubscribeCommands)return;

 unsubscribeCommands=onValue(
  ref(db,'remote/command'),
  snapshot=>{
   const command=snapshot.val();

   if(!initialized){
    initialized=true;
    lastCommandId=command?.id||null;
    return;
   }

   handleCommand(command);
  },
  error=>{
   stopOS('BŁĄD ODCZYTU');
   status('BŁĄD ODCZYTU POLECEŃ: '+error.code);
  }
 );
}

function unsubscribeAll(){
 if(unsubscribeCommands){
  unsubscribeCommands();
  unsubscribeCommands=null;
 }
 initialized=false;
 lastCommandId=null;
}

onValue(ref(db,'.info/serverTimeOffset'),snapshot=>{
 serverOffset=Number(snapshot.val())||0;
});

onValue(ref(db,'.info/connected'),snapshot=>{
 const wasConnected=connected;
 connected=snapshot.val()===true;

 $('connection').textContent=connected
  ? '● ONLINE'
  : '● OFFLINE';

 $('connection').style.color=connected
  ? '#00e070'
  : '#ff4444';

 if(wasConnected && !connected){
  stopOS('UTRATA INTERNETU');
 }else if(!running && !goVisible && !locked){
  showIdle();
 }
});

onAuthStateChanged(auth,user=>{
 const ok=user?.uid===TABLET_UID;

 $('loginScreen').style.display=ok?'none':'block';
 $('appScreen').style.display=ok?'flex':'none';

 if(ok){
  subscribeCommands();
  showIdle();
 }else{
  unsubscribeAll();
  cancelTimers();

  $('loginStatus').textContent=user
   ? 'To nie jest konto TABLETU.'
   : 'Zaloguj się kontem TABLETU.';
 }
});

$('loginBtn').onclick=async()=>{
 try{
  await signInWithEmailAndPassword(
   auth,
   $('email').value.trim(),
   $('password').value
  );
  $('password').value='';
 }catch(e){
  $('loginStatus').textContent=
   'Błąd logowania: '+e.code;
 }
};

$('logoutBtn').onclick=()=>signOut(auth);

$('stopBtn').onclick=()=>{
 stopOS('TABLET · LOKALNIE');
};

$('unlockBtn').onclick=()=>{
 if(confirm('Odblokować OS na tablecie?')){
  unlockOS('TABLET · LOKALNIE');
 }
};

function updateClock(){
 const now=new Date();

 $('clock').textContent=
  now.toLocaleTimeString('pl-PL',{
   hour:'2-digit',
   minute:'2-digit',
   second:'2-digit',
   hour12:false
  });
}

updateClock();
setInterval(updateClock,200);
</script>
</body>
</html>
